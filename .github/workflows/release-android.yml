name: Release signed Android widget

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakura-release.keystore"
          test -s "$RUNNER_TEMP/sakura-release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/sakura-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"
            exit 1
          }
          test -n "$ANDROID_KEY_ALIAS" || {
            echo "::error::Missing ANDROID_KEY_ALIAS repository secret"
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"
            exit 1
          }
          gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk sakura-clock-weather.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Sakura Clock Weather v${{ github.run_number }}"
          generate_release_notes: true
          files: sakura-clock-weather.apk